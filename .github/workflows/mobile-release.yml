name: Mobile release

# sendtally's app. The pipeline lives in mobile-app-release.yml; this file only
# decides which pushes reach it. Runbook: docs/mobile-release.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/api-client/**"
      - "packages/auth-native/**"
      - "packages/core/**"
      - "packages/design/**"
      - "packages/features/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-release.yml"
      - ".github/workflows/mobile-app-release.yml"
  workflow_dispatch:

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/mobile-app-release.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      app: mobile
      title: Mobile
      other-app: hangtally
      platforms: ${{ vars.MOBILE_PLATFORMS || 'android' }}
