name: Expo dependency bump

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo install --fix
        working-directory: apps/mobile
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/expo-sdk-patch-bump
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -am "fix(mobile): bump Expo SDK patch versions"
          git push -f origin "$BRANCH"
          gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN ||
            gh pr create --head "$BRANCH" --title "fix(mobile): bump Expo SDK patch versions" \
              --body "Weekly \`expo install --fix\` in \`apps/mobile\` so expo-doctor stays green."
