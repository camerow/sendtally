name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # The mobile release derives its semantic version from the commit subjects
  # since the last tag, so an unconventional commit does not just read badly -
  # it silently downgrades a release to a patch bump.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Every commit on the branch
        run: >
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      # A squash merge lands the pull request title rather than any of the
      # commits above, so it has to hold up on its own.
      - name: The pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$TITLE" | pnpm exec commitlint --verbose

  # Workers Builds comments a logs link and no preview URL. The URL is a pure
  # function of the branch, though - it aliases each version to the branch name
  # - so the link can go up straight away and works the moment the build lands.
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | cut -c1-63)
          url="https://${slug%-}-sendtally-web-staging.chalk-and-circuits.workers.dev"
          printf '**Preview:** %s\n\nLive once `Workers Builds: sendtally-web-staging` passes. It is the staging sandbox - the development Clerk instance and the staging database - so sign in and click anything.\n' "$url" \
            | gh pr comment "$PR" --edit-last --create-if-none --body-file -
