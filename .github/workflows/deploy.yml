name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy-api:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require runtime secrets
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          ../../.github/scripts/require-secrets.sh ${{ env.DEPLOY_ENV }}
          TOKEN_KEY CLERK_SECRET_KEY CLERK_WEBHOOK_SIGNING_SECRET STRAVA_CLIENT_ID STRAVA_CLIENT_SECRET STRAVA_WEBHOOK_VERIFY_TOKEN
          REVENUECAT_SECRET_API_KEY REVENUECAT_WEBHOOK_AUTH
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/api
          command: d1 migrations apply DB --env ${{ env.DEPLOY_ENV }} --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/api
          command: deploy --env ${{ env.DEPLOY_ENV }}

  deploy-web:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require runtime secrets
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../.github/scripts/require-secrets.sh ${{ env.DEPLOY_ENV }} CLERK_SECRET_KEY
      - run: pnpm --filter @sendtally/web build
        env:
          CLOUDFLARE_ENV: ${{ env.DEPLOY_ENV }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

  # A web release is a record of what is live, so it is cut after both Workers
  # deploy. Nothing in the web app carries a version number, so the tag itself
  # is the version: the last one plus whatever the commits since it call for.
  release:
    needs: [deploy-sync-service, deploy-web]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive the version and notes
        id: release
        run: |
          set -euo pipefail
          previous=$(git tag --list 'web-v*' --sort=-v:refname | head -1)
          range=${previous:+$previous..}HEAD
          # Mobile-only commits deploy nothing here, so they release nothing.
          .github/scripts/release-notes.sh "$range" . ':!apps/mobile' > notes.md
          if [ ! -s notes.md ]; then
            echo "Nothing user-facing since ${previous:-the first commit}; no release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r next bump < <(.github/scripts/next-version.sh "${previous#web-v}" "$range" . ':!apps/mobile')
          echo "Releasing web-v$next ($bump) since ${previous:-the first commit}"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: >
          gh release create "web-v$VERSION"
          --title "Web v$VERSION"
          --target "$GITHUB_SHA"
          --notes-file notes.md
