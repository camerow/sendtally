version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Expo pins these to the SDK; `expo install --fix` owns their versions.
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: "@expo/*"
      - dependency-name: "@expo-google-fonts/*"
      - dependency-name: babel-preset-expo
      - dependency-name: react-native
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-screens
      - dependency-name: react-native-svg
      # Pinned by the overrides in pnpm-workspace.yaml.
      - dependency-name: react
      - dependency-name: react-dom
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /tools/cli-go
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
