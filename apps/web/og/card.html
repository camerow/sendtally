<!doctype html>
<!--
  Source for apps/web/public/og.jpg (1200x630). Regenerate:
  chrome --headless --force-device-scale-factor=2 --window-size=1200,630 \
    --virtual-time-budget=6000 --screenshot=og.png file://$PWD/apps/web/og/card.html
  sips -s format jpeg -s formatOptions 88 -z 630 1200 og.png --out apps/web/public/og.jpg
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .b {
        width: 1200px;
        height: 630px;
        background: #2b2a34;
        color: #ffffff;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .wordmark {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        font-size: 30px;
        letter-spacing: -0.02em;
        color: #eed3f8;
      }
      .b-head {
        font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif;
        font-weight: 800;
        font-size: 70px;
        line-height: 1;
        letter-spacing: -0.03em;
        margin: 40px 0 0;
        max-width: 17ch;
      }
      .b-stats {
        display: flex;
        gap: 56px;
        margin-top: 30px;
      }
      .k {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
      }
      .v {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        font-size: 34px;
        letter-spacing: -0.02em;
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
      }
      .v .u {
        font-size: 16px;
        opacity: 0.55;
        margin-left: 3px;
      }
      .b-chart {
        margin-top: auto;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 210px;
      }
      .b-chart i {
        flex: 1;
        border-radius: 4px 4px 0 0;
        background: linear-gradient(180deg, rgba(249, 220, 92, 0.95), rgba(249, 220, 92, 0.3));
      }
      .b-axis {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 10px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.4);
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        padding-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="b">
      <div class="lockup">
        <svg viewBox="0 0 32 32" width="42" height="42">
          <rect width="32" height="32" rx="8" fill="#F9DC5C"></rect>
          <path
            d="M9.5 22.5 16 16l6.5-6.5"
            fill="none"
            stroke="#403F4C"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
          <circle cx="9.5" cy="22.5" r="3.1" fill="#403F4C"></circle>
          <circle cx="16" cy="16" r="3.1" fill="#403F4C"></circle>
          <circle cx="22.5" cy="9.5" r="3.1" fill="#403F4C"></circle>
        </svg>
        <span class="wordmark">sendtally</span>
      </div>
      <h1 class="b-head">Track your climbing, see the trends.</h1>
      <div class="b-stats">
        <div>
          <div class="k">Sessions</div>
          <div class="v">48</div>
        </div>
        <div>
          <div class="k">Avg effort</div>
          <div class="v">6.4<span class="u">/10</span></div>
        </div>
        <div>
          <div class="k">Hardest send</div>
          <div class="v">V8</div>
        </div>
        <div>
          <div class="k">Flash rate</div>
          <div class="v">31<span class="u">%</span></div>
        </div>
      </div>
      <div class="b-chart">
        <i style="height: 38%"></i><i style="height: 52%"></i><i style="height: 44%"></i
        ><i style="height: 61%"></i> <i style="height: 57%"></i><i style="height: 72%"></i
        ><i style="height: 66%"></i><i style="height: 81%"></i> <i style="height: 74%"></i
        ><i style="height: 88%"></i><i style="height: 79%"></i><i style="height: 100%"></i>
      </div>
      <div class="b-axis">
        <span>NOV</span><span></span><span></span><span>FEB</span><span></span><span></span
        ><span>MAY</span><span></span><span></span><span>AUG</span><span></span><span></span>
      </div>
    </div>
  </body>
</html>
