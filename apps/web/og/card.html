<!doctype html>
<!--
  Source for apps/web/public/og.jpg (1200x630). Regenerate:
  chrome --headless --force-device-scale-factor=2 --window-size=1200,630 \
    --virtual-time-budget=6000 --screenshot=og.png file://$PWD/apps/web/og/card.html
  sips -s format jpeg -s formatOptions 88 -z 630 1200 og.png --out apps/web/public/og.jpg
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .b {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #2b2a34;
        color: #ffffff;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        overflow: hidden;
      }
      .photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 62% 72%;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to top,
            rgba(43, 42, 52, 0.99) 0%,
            rgba(43, 42, 52, 0.97) 34%,
            rgba(43, 42, 52, 0.7) 52%,
            rgba(43, 42, 52, 0.18) 72%,
            rgba(43, 42, 52, 0) 100%
          ),
          linear-gradient(
            to right,
            rgba(43, 42, 52, 0.72) 0%,
            rgba(43, 42, 52, 0.12) 48%,
            rgba(43, 42, 52, 0) 70%
          );
      }
      .plate {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 64px;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .wordmark {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        font-size: 38px;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      .b-head {
        font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif;
        font-weight: 800;
        font-size: 62px;
        line-height: 1.02;
        letter-spacing: -0.03em;
        margin: 26px 0 0;
        max-width: 16ch;
        text-wrap: balance;
      }
      .b-sub {
        font-family: "IBM Plex Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.62);
        margin-top: 22px;
      }
      .rule {
        height: 4px;
        width: 92px;
        border-radius: 2px;
        background: #f9dc5c;
        margin-top: 26px;
      }
    </style>
  </head>
  <body>
    <div class="b">
      <img class="photo" src="../public/images/landing/band.jpg" alt="" />
      <div class="scrim"></div>
      <div class="plate">
        <div class="lockup">
          <svg viewBox="0 0 32 32" width="52" height="52">
            <rect width="32" height="32" rx="8" fill="#F9DC5C"></rect>
            <path
              d="M9.5 22.5 16 16l6.5-6.5"
              fill="none"
              stroke="#403F4C"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
            <circle cx="9.5" cy="22.5" r="3.1" fill="#403F4C"></circle>
            <circle cx="16" cy="16" r="3.1" fill="#403F4C"></circle>
            <circle cx="22.5" cy="9.5" r="3.1" fill="#403F4C"></circle>
          </svg>
          <span class="wordmark">sendtally</span>
        </div>
        <h1 class="b-head">Track your climbing, see the trends.</h1>
        <div class="rule"></div>
      </div>
    </div>
  </body>
</html>
