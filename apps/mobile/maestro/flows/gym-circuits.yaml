appId: com.sendtally.app
name: gym-circuits
# A gym with the color circuits and a wall, added from the Log tab's setup card, saved with
# an explicit Save, then a climb logged on a circuit from the live session. Cleans up after
# itself so the account has no gym for the next run.
---
- runFlow: ../helpers/open-dev-client.yaml
- runFlow: ../helpers/ensure-signed-in.yaml
- runFlow: ../helpers/discard-live-session.yaml
- runFlow: ../helpers/delete-maestro-gym.yaml
- tapOn: "Log(, tab.*)?"
- runFlow:
    when:
      visible: "Add your gym"
    commands:
      - tapOn: "Add gym"
- runFlow:
    when:
      notVisible: "New gym"
    commands:
      - tapOn: "Settings(, tab.*)?"
      - scrollUntilVisible:
          element: "Add gym"
          direction: DOWN
      - tapOn: "Add gym"
- assertVisible: "New gym"
- assertVisible: "Circuits, Color circuits"
- tapOn:
    id: "gym-name"
- inputText: "Maestro Barn"
- pressKey: Enter
- scrollUntilVisible:
    element: "Save gym"
    direction: DOWN
- tapOn:
    id: "gym-wall"
- inputText: "Cave"
- pressKey: Enter
- assertVisible: "Remove wall: Cave"
- tapOn: "Save gym"
- tapOn: "Log(, tab.*)?"
- assertNotVisible: "Add your gym"
- tapOn: "Climb"
- assertVisible: "CLIMB 1 OF 1"
- tapOn: "Type, .*"
- tapOn: "Maestro Barn circuits"
- tapOn: "Grade, .*"
- tapOn: "Yellow.*V1–V2"
- assertVisible: "Grade, Yellow · V1–V2"
- tapOn: "Cave"
- tapOn: "V2"
- scrollUntilVisible:
    element: "Save"
    direction: DOWN
- tapOn: "Save"
- assertVisible: ".*In progress for .* · Maestro Barn.*"
- assertVisible: "Yellow V2 Yellow · Cave, attempt, 1 try"
- runFlow: ../helpers/discard-live-session.yaml
- runFlow: ../helpers/delete-maestro-gym.yaml
