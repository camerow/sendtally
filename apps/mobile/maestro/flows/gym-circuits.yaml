appId: com.sendtally.app
name: gym-circuits
# A gym with the color circuits and a wall, added from Settings and saved with an explicit
# Save, then a climb logged on a circuit from a live session. Cleans up after itself so the
# account has no gym for the next run.
---
- runFlow: ../helpers/open-dev-client.yaml
- runFlow: ../helpers/ensure-signed-in.yaml
- runFlow: ../helpers/discard-live-session.yaml
- runFlow: ../helpers/delete-maestro-gym.yaml
- tapOn: "Account and settings"
- scrollUntilVisible:
    element: "Add gym"
    direction: DOWN
- tapOn: "Add gym"
- assertVisible: "New gym"
- assertVisible: "Circuits, Color circuits"
- tapOn:
    id: "gym-name"
- inputText: "Maestro Barn"
- pressKey: Enter
- scrollUntilVisible:
    element: "Save gym"
    direction: DOWN
- tapOn:
    id: "gym-wall"
- inputText: "Cave"
- pressKey: Enter
- assertVisible: "Remove wall: Cave"
- tapOn: "Save gym"
- assertVisible: "Maestro Barn.*"
- tapOn: "BACK"
- tapOn: "Start session"
- tapOn: "Gym, No gym"
- tapOn: "Maestro Barn"
- assertVisible: "Gym, Maestro Barn"
- tapOn: "Yellow"
- tapOn: "Fell"
- tapOn: "Edit climb"
- assertVisible: "1 OF 1"
- assertVisible: "Type, Maestro Barn circuits"
- assertVisible: "Grade, Yellow · V1–V2"
- tapOn: "Cave"
- tapOn: "V2"
- tapOn: "Save"
- assertNotVisible: "1 OF 1"
- assertVisible: "Yellow, 1 fall"
- tapOn: "Minimize"
- runFlow: ../helpers/discard-live-session.yaml
- runFlow: ../helpers/delete-maestro-gym.yaml
