appId: com.sendtally.app
name: draft-survives-leaving
# A climb added right before leaving the form must be there when the form is opened again,
# the session list must offer the draft back, and tapping that offer must open the form
# already on the draft rather than asking again.
---
- runFlow: ../helpers/open-dev-client.yaml
- runFlow: ../helpers/ensure-signed-in.yaml
- tapOn: "Climbing session"
- runFlow:
    when:
      visible: "Start fresh"
    commands:
      - tapOn: "Start fresh"
      - tapOn: "Discard"
- scrollUntilVisible:
    element:
      text: "\\+ ADD CLIMB"
    direction: DOWN
- tapOn: "\\+ ADD CLIMB"
- tapOn: "Done"
- scrollUntilVisible:
    element:
      text: "\\+ ADD CLIMB"
    direction: DOWN
- tapOn: "\\+ ADD CLIMB"
- tapOn: "Done"
- scrollUntilVisible:
    element:
      text: "← LOG"
    direction: UP
- tapOn: "← LOG"
- assertVisible: "Unfinished session.*"
- tapOn: "Climbing session"
- assertVisible: "You have an unfinished session.*"
- assertVisible: "3 CLIMBS.*"
- tapOn: "Pick up"
- assertVisible: "3 CLIMBS.*"
- scrollUntilVisible:
    element:
      text: "← LOG"
    direction: UP
- tapOn: "← LOG"
- tapOn: "Unfinished session.*"
- assertVisible: "3 CLIMBS.*"
- assertNotVisible: "You have an unfinished session.*"
- scrollUntilVisible:
    element:
      text: "← LOG"
    direction: UP
- tapOn: "← LOG"
