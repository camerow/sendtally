appId: com.sendtally.app
name: draft-survives-leaving
# A climb added right before leaving the form must be there when the form is opened again,
# offered as the unfinished draft, and picking it up must bring every climb back.
---
- runFlow: ../helpers/open-dev-client.yaml
- runFlow: ../helpers/ensure-signed-in.yaml
- runFlow: ../helpers/open-log-form.yaml
- runFlow:
    when:
      visible: "Start fresh"
    commands:
      - tapOn: "Start fresh"
      - tapOn:
          text: "Discard"
          rightOf: "Cancel"
- scrollUntilVisible:
    element:
      text: "Add climb"
    direction: DOWN
    centerElement: true
- tapOn: "Add climb"
- tapOn: "Save"
- scrollUntilVisible:
    element:
      text: "Add climb"
    direction: DOWN
    centerElement: true
- tapOn: "Add climb"
- tapOn: "Save"
- scrollUntilVisible:
    element:
      text: "LOG"
    direction: UP
- tapOn: "LOG"
- runFlow: ../helpers/open-log-form.yaml
- assertVisible: "You have an unfinished session.*"
- assertVisible: "3 CLIMBS.*"
- tapOn: "Pick up"
- assertNotVisible: "You have an unfinished session.*"
- scrollUntilVisible:
    element:
      text: "CLIMBS · 3"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "LOG"
    direction: UP
- tapOn: "LOG"
