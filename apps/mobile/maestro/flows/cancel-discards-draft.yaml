appId: com.sendtally.app
name: cancel-discards-draft
# Discard walks away from the form, so it must not leave the autosaved draft behind:
# it confirms first, and once discarded neither the session list nor the form offers
# the draft back.
---
- runFlow: ../helpers/open-dev-client.yaml
- runFlow: ../helpers/ensure-signed-in.yaml
- runFlow: ../helpers/open-log-form.yaml
- runFlow:
    when:
      visible: "Start fresh"
    commands:
      - tapOn: "Start fresh"
      - tapOn: "Discard"
- scrollUntilVisible:
    element:
      text: "\\+ ADD CLIMB"
    direction: DOWN
    centerElement: true
- tapOn: "\\+ ADD CLIMB"
- tapOn: "Save"
- tapOn: "Discard"
- assertVisible: "Discard this draft.*"
- tapOn: "Discard"
- extendedWaitUntil:
    visible: "Climb"
    timeout: 15000
- assertNotVisible: "Unfinished session.*"
- runFlow: ../helpers/open-log-form.yaml
- assertNotVisible: "You have an unfinished session.*"
- scrollUntilVisible:
    element:
      text: "← LOG"
    direction: UP
- tapOn: "← LOG"
