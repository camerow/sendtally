appId: com.sendtally.app
name: cancel-discards-draft
# Discard walks away from the form, so it must not leave the autosaved draft behind:
# it confirms first, and once discarded the form does not offer the draft back.
---
- runFlow: ../helpers/open-dev-client.yaml
- runFlow: ../helpers/ensure-signed-in.yaml
- runFlow: ../helpers/open-log-form.yaml
- runFlow:
    when:
      visible: "Start fresh"
    commands:
      - tapOn: "Start fresh"
      - tapOn:
          text: "Discard"
          rightOf: "Cancel"
- scrollUntilVisible:
    element:
      text: "Add climb"
    direction: DOWN
    centerElement: true
- tapOn: "Add climb"
- tapOn: "Save"
- tapOn: "Discard"
- assertVisible: "Discard this draft.*"
- tapOn:
    text: "Discard"
    rightOf: "Cancel"
- extendedWaitUntil:
    visible: "Account and settings"
    timeout: 15000
- runFlow: ../helpers/open-log-form.yaml
- assertNotVisible: "You have an unfinished session.*"
- scrollUntilVisible:
    element:
      text: "LOG"
    direction: UP
- tapOn: "LOG"
