appId: com.sendtally.app
name: project-session-opens
# The sessions a project lists are links to those sessions, and had the same dead View-inside-a-
# Link as the project rows. Logging a session on the climb project-opens made is what puts a row
# there to tap, so this runs after it. The session is deleted at the end so the account does not
# grow one per run.
---
- runFlow: ../helpers/open-dev-client.yaml
- runFlow: ../helpers/ensure-signed-in.yaml
- runFlow: ../helpers/open-log-form.yaml
- runFlow:
    when:
      visible: "Start fresh"
    commands:
      - tapOn: "Start fresh"
      - tapOn: "Discard"
- scrollUntilVisible:
    element:
      text: "\\+ ADD CLIMB"
    direction: DOWN
    centerElement: true
- tapOn: "\\+ ADD CLIMB"
- tapOn: "Name (optional)"
# The climb rolls up by its name, so typing the project's name is what files this session under
# it. iOS keeps the keyboard over the rest of the sheet and hideKeyboard does not take on these
# inputs; Enter on a single-line field does.
# Enter blurs the field and puts Save back on screen, so no hideKeyboard here: that is the back
# key on Android, and with the keyboard already gone it dismisses the sheet and leaves the form.
- inputText: "Maestro Arete"
- pressKey: Enter
- tapOn: "Save"
- scrollUntilVisible:
    element:
      text: "Done"
    direction: DOWN
- tapOn: "Done"
- extendedWaitUntil:
    visible: "← LOG"
    timeout: 30000
- tapOn: "← LOG"
- tapOn: "Projects(, tab.*)?"
- extendedWaitUntil:
    visible: ".*, Maestro Arete, .*"
    timeout: 30000
- tapOn: ".*, Maestro Arete, .*"
- extendedWaitUntil:
    visible: "ATTEMPTS PER SESSION"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "(?i)sessions invested"
    direction: DOWN
    centerElement: true
- assertNotVisible: "NOT TRIED YET"
# The session row is one accessible element too, spoken date-first, so it is matched by the
# session title in the middle of it.
- tapOn: ".*Logged session.*"
- extendedWaitUntil:
    visible: "← LOG"
    timeout: 20000
- tapOn: "← LOG"
- assertVisible: "(?i)sessions invested"
# Back lands on the project page still scrolled to its sessions, and the page's way back is at
# the top of that scroll view.
- scrollUntilVisible:
    element:
      text: "Projects(, tab.*)?"
    direction: UP
- tapOn: "Projects(, tab.*)?"
- assertVisible: "New project"
- tapOn: ".*, Maestro Arete, .*"
- extendedWaitUntil:
    visible: "ATTEMPTS PER SESSION"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "(?i)sessions invested"
    direction: DOWN
    centerElement: true
- tapOn: ".*Logged session.*"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 20000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Delete session?"
    timeout: 10000
# iOS keeps the header's Delete in the tree under the alert and Android does not, so the alert's
# is found by its place beside Cancel.
- tapOn:
    text: "Delete"
    rightOf: "Cancel"
- extendedWaitUntil:
    visible: "Climb"
    timeout: 20000
