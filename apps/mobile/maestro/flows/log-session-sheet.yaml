appId: com.sendtally.app
name: log-session-sheet
# The climb editor sheet: opens on add, stays usable with the keyboard up, and goes away on a
# swipe down. This is the interaction that broke on Expo SDK 57 and only shows on a device.
---
- runFlow: ../helpers/open-dev-client.yaml
- runFlow: ../helpers/ensure-signed-in.yaml
- runFlow: ../helpers/discard-live-session.yaml
- runFlow: ../helpers/open-log-form.yaml
- scrollUntilVisible:
    element:
      text: "\\+ ADD CLIMB"
    direction: DOWN
    centerElement: true
- tapOn: "\\+ ADD CLIMB"
- assertVisible: "CLIMB 2 OF 2"
- tapOn: "Name (optional)"
- inputText: "Cascade"
- assertVisible: "Cascade"
- pressKey: Enter
- assertVisible: "Save"
# On iOS only a bare direction swipe reaches React Native's responder system (coordinate and
# element swipes go through a press-and-drag that RN never sees). On Android the swipe starts on
# the sheet's handle, since a fixed point can land on a text input that keeps the gesture.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          direction: DOWN
          duration: 400
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          from: "Bottom sheet handle"
          direction: DOWN
          duration: 300
- assertNotVisible: "CLIMB 2 OF 2"
- assertVisible: "V3 Cascade.*"
- scrollUntilVisible:
    element:
      text: "← LOG"
    direction: UP
- tapOn: "← LOG"
- runFlow: ../helpers/discard-live-session.yaml
