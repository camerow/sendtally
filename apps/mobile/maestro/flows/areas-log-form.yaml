appId: com.sendtally.app
name: areas-log-form
# An outdoor climb offers an area search and Areas climbs in the name field. Each add sheet
# opens over what launched it, and closing one leaves the climb editor underneath open.
# Nothing is saved, so the flow leaves no Areas content behind. A tap on the scrim above
# the sheets closes the top one only.
---
- runFlow: ../helpers/open-dev-client.yaml
- runFlow: ../helpers/ensure-signed-in.yaml
- runFlow: ../helpers/discard-live-session.yaml
- runFlow: ../helpers/open-log-form.yaml
- runFlow:
    when:
      visible: "Start fresh"
    commands:
      - tapOn: "Start fresh"
      - tapOn:
          text: "Discard"
          rightOf: "Cancel"
- tapOn: "OUTDOOR"
- scrollUntilVisible:
    element:
      text: "Add climb"
    direction: DOWN
    centerElement: true
- tapOn: "Add climb"
- assertVisible: "2 OF 2"
# The area sits in the climb sheet, and its add sheet opens over it.
- tapOn: "Search areas"
- inputText: "Qzx never added"
- tapOn: "\\+ Add “Qzx never added” as an area"
- assertVisible: "Add an area"
- assertVisible: "You're sharing this under CC0."
- tapOn:
    point: "50%,15%"
- assertNotVisible: "Add an area"
- assertVisible: "2 OF 2"
- tapOn: "Name (optional)"
- inputText: "Qzx never added"
- tapOn: "\\+ Add “Qzx never added” to Areas"
- assertVisible: "Add a climb"
# The Areas climb sheet stops short of the climb editor's top, so the strip between them is
# the scrim that closes it and leaves the editor underneath open.
- tapOn:
    point: "50%,15%"
- assertNotVisible: "Add a climb"
- assertVisible: "2 OF 2"
- tapOn: "Save"
- assertNotVisible: "2 OF 2"
- scrollUntilVisible:
    element:
      text: "LOG"
    direction: UP
- tapOn: "LOG"
- runFlow: ../helpers/discard-live-session.yaml
