appId: com.sendtally.app
# A live session left behind by an earlier flow would take the next climb, so discard it from
# the live bar above the tabs.
---
- runFlow:
    when:
      visible: "Finish session"
    commands:
      - tapOn: "Finish session"
      - tapOn: "Discard session"
      - assertVisible: "Discard this session?"
      - tapOn:
          text: "Discard"
          rightOf: "Cancel"
      - extendedWaitUntil:
          notVisible: "Finish session"
          timeout: 15000
