appId: com.sendtally.app
env:
  DEV_CLIENT: "true"
# Locally the app is a development build that opens on its launcher unless it is deep-linked
# to Metro, and shows a developer menu the first time. In CI the bundle is embedded, so the
# workflow passes DEV_CLIENT=false and the app just launches.
---
- launchApp:
    stopApp: true
- runFlow:
    when:
      true: ${DEV_CLIENT == "true"}
    commands:
      - openLink: "com.sendtally.app://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"
      - extendedWaitUntil:
          visible:
            text: ".*"
          timeout: 30000
      - runFlow:
          when:
            visible: "This is the developer menu.*"
          commands:
            - tapOn: "Close"
