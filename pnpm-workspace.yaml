packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@clerk/shared": false
  "@parcel/watcher": false
  "@posthog/cli": false
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
  workerd: false
minimumReleaseAgeExclude:
  - expo
  - "expo-*"
  - "@expo/*"
  - babel-preset-expo
overrides:
  react: "19.2.3"
  react-dom: "19.2.3"
